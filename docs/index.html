<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zcode-plugins-community · ZCode 社区插件市场</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #101014; color: #e6e6ea; line-height: 1.6; padding: 48px 20px 80px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -0.02em; }
  h1 small { display: block; font-size: .85rem; font-weight: 400; color: #8b8b94; margin-top: 6px; }
  .install {
    margin: 24px 0 40px; padding: 14px 16px; background: #1a1a20; border: 1px solid #2a2a32;
    border-radius: 10px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: .82rem; color: #9ee493; overflow-x: auto; white-space: pre;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: #1a1a20; border: 1px solid #2a2a32; border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 8px; transition: border-color .15s;
  }
  .card:hover { border-color: #4a4a56; }
  .card h2 { font-size: 1.02rem; font-weight: 600; }
  .card .en { font-size: .78rem; color: #8b8b94; }
  .card p { font-size: .85rem; color: #c2c2ca; flex: 1; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .72rem; color: #8b8b94; }
  .badge { background: #23232b; border-radius: 999px; padding: 2px 10px; }
  .badge.cat { color: #7ab8ff; }
  a { color: inherit; }
  footer { margin-top: 48px; font-size: .78rem; color: #6b6b74; }
  footer code { color: #9ee493; }
</style>
</head>
<body>
<div class="wrap">
  <h1>zcode-plugins-community
    <small>ZCode 社区插件市场 · 与官方市场平级挂载，内容互相独立</small>
  </h1>
  <div class="install">zcode plugins marketplace add wdfdsyhb/zcode-plugins-community --scope user</div>
  <div class="grid" id="grid"></div>
  <footer>
    提交插件见仓库 <a href="https://github.com/wdfdsyhb/zcode-plugins-community">wdfdsyhb/zcode-plugins-community</a>
    的 docs/SUBMIT.md · 挂载命令二选一：<code>git</code> 直连或 jsDelivr 镜像 · 收录内容仅用于授权测试与学习场景
  </footer>
</div>
<script>
fetch('../marketplace.json')
  .then(r => r.json())
  .then(m => {
    const grid = document.getElementById('grid');
    for (const p of m.plugins) {
      const el = document.createElement('div');
      el.className = 'card';
      const zh = p.description_i18n?.['zh-CN'] || p.description || '';
      const en = p.description_i18n?.en || '';
      el.innerHTML = `
        <h2>${p.displayName || p.name}</h2>
        <div class="en">${p.name} · v${p.version || '?'} · by ${p.author?.name || '?'}</div>
        <p>${zh}</p>
        <div class="meta">
          <span class="badge cat">${p.category || 'misc'}</span>
          ${(p.keywords || []).slice(0, 4).map(k => `<span class="badge">${k}</span>`).join('')}
        </div>`;
      grid.appendChild(el);
    }
  })
  .catch(() => { document.getElementById('grid').innerHTML = '<p>加载失败：请在仓库页面查看 marketplace.json</p>'; });
</script>
</body>
</html>
