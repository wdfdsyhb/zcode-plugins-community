name: discover
on:
  schedule:
    - cron: "23 5 * * *"   # 每天 05:23 UTC(北京时间 13:23),避免高频刷 issue
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan GitHub topics for new ZCode plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/discover.py docs/auto-candidates.md
      - name: Update rolling candidate issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "candidates: ZCode 插件候选清单(每日自动)"
          content-filepath: docs/auto-candidates.md
          labels: discovery
          issue-number: 19   # 滚动更新同一个 issue,不再每天新建
          comment: "每日自动扫描结果,直接更新本 issue 正文,历史见仓库 docs/auto-candidates.md"
