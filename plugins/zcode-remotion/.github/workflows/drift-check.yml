name: upstream-compatibility

# Daily upstream compatibility governance.
#
# - low-risk drift (version-only, same skill topology): validate for real,
#   then open ONE deterministic PR that moves the recorded baseline. Never merged
#   automatically.
# - high-risk drift (major bump / skill added-removed-renamed): maintainer
#   review issue — a changed topology is never treated as compatible.
# - unknown (upstream unreadable): log only, no issue spam from transient failures.

on:
  schedule:
    - cron: "17 2 * * *" # daily, off-round minute to reduce Actions congestion
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }

      - name: Observe upstream and classify drift
        id: drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/drift-check.mjs --json > drift.json
          cat drift.json
          node -e "
            const fs = require('node:fs');
            const d = JSON.parse(fs.readFileSync('./drift.json', 'utf8'));
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, 'level=' + d.level + '\n');
            fs.appendFileSync(out, 'pr_title=' + d.prTitle + '\n');
            fs.appendFileSync(out, 'pr_branch=' + d.prBranch + '\n');
            fs.appendFileSync(out, 'issue_title=' + (d.issueTitle ?? 'none') + '\n');
            fs.appendFileSync(out, 'upstream=' + (d.upstream ? d.upstream.remotion : 'unknown') + '\n');
          "

      # ---- low-risk drift: candidate baseline → validate → deliver ----
      # Stages have stable IDs so failures classify correctly:
      # candidate_write / static_validation / compat_validation = VALIDATION,
      # pr_delivery = DELIVERY. A delivery failure is NOT a validation failure.

      - name: Update recorded baseline (candidate)
        id: candidate_write
        if: steps.drift.outputs.level == 'low'
        run: node scripts/drift-check.mjs --write

      - name: Static validation
        id: static_validation
        if: steps.drift.outputs.level == 'low'
        run: |
          node --test scripts/verify-plugin.test.mjs
          node scripts/verify-plugin.mjs --offline

      - name: Real Remotion smoke test at the new baseline (still + MP4)
        id: compat_validation
        if: steps.drift.outputs.level == 'low'
        run: node scripts/compat-smoke.mjs --mp4

      - name: Open compatibility PR (never auto-merged)
        id: pr_delivery
        if: steps.drift.outputs.level == 'low'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.drift.outputs.pr_branch }}
          PR_TITLE: ${{ steps.drift.outputs.pr_title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(gh pr list --state open --head "$PR_BRANCH" --json url -q '.[0].url')" ]; then
            echo "compatibility PR already open for $PR_BRANCH — nothing to do"
            exit 0
          fi
          git checkout -b "$PR_BRANCH"
          git add compatibility/remotion.json README.md README.zh-CN.md
          git commit -m "$PR_TITLE"
          git push origin "$PR_BRANCH"
          node -e "
            const fs = require('node:fs');
            const d = JSON.parse(fs.readFileSync('./drift.json', 'utf8'));
            const body = [
              'Automated compatibility baseline update. Candidate state, validated by this workflow run:',
              '',
              'Candidate compatibility state:',
              '',
              'Remotion:        ' + d.upstream.remotion,
              'official skills: ' + d.upstream.skills,
              'Mediabunny:      ' + d.upstream.mediabunny + ' (official pairing, resolved from @remotion/media published metadata)',
              'skill topology:  ' + d.upstream.skillNames.length,
              '',
              'Validation:',
              '- official pairing lookup PASS (recorded pairing equals the independently resolved official pairing)',
              '- unit/static PASS',
              '- official skills bootstrap PASS',
              '- Remotion versions consistency PASS',
              '- still PASS',
              '- MP4 PASS',
              '',
              'Human checklist before merging:',
              '- [ ] Skim the upstream Remotion release notes (https://github.com/remotion-dev/remotion/releases) for user-facing/behavior changes in the crossed range',
              '- [ ] Confirm nothing affects zcode-remotion\\'s orchestration assumptions',
              '',
              '**If this baseline PR is merged, publish a plugin patch release** so existing ZCode installs receive the new shipped compatibility state.',
              '',
              'This PR is never merged automatically.',
            ].join('\\n');
            fs.writeFileSync('pr-body.md', body);
          "
          gh pr create --title "$PR_TITLE" --body-file pr-body.md --head "$PR_BRANCH" --base main

      # ---- low-risk drift whose VALIDATION failed ----
      # Tied to the validation steps specifically — a PR-creation/push/permission
      # error must not be reported as a compatibility-validation failure
      # (that misclassification created issue #8 on 2026-09-01).

      - name: Open validation-failed issue
        if: >-
          failure() &&
          steps.drift.outputs.level == 'low' &&
          (steps.candidate_write.outcome == 'failure' || steps.static_validation.outcome == 'failure' || steps.compat_validation.outcome == 'failure')
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const d = JSON.parse(fs.readFileSync('./drift.json', 'utf8'));
            const title = 'Compatibility validation FAILED: Remotion ' + d.upstream.remotion;
            const existing = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo,
              title,
              body: 'Upstream Remotion ' + d.upstream.remotion + ' moved (baseline: ' + d.recorded.remotion +
                    '), but the compatibility validation run failed — maintainer review required.\n\n' +
                    'See the workflow run for the failing validation step. Do not bump `compatibility/remotion.json` until this is resolved.'
            });

      # ---- low-risk drift whose VALIDATION passed but DELIVERY failed ----
      # (branch push / PR creation / permissions). The candidate was proven
      # compatible; only its delivery failed. Reported separately.

      - name: Open delivery-failed issue
        if: >-
          failure() &&
          steps.drift.outputs.level == 'low' &&
          steps.candidate_write.outcome == 'success' &&
          steps.static_validation.outcome == 'success' &&
          steps.compat_validation.outcome == 'success' &&
          steps.pr_delivery.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const d = JSON.parse(fs.readFileSync('./drift.json', 'utf8'));
            const title = 'Compatibility PR delivery FAILED: Remotion ' + d.upstream.remotion;
            const existing = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo,
              title,
              body: 'Compatibility validation PASSED for the candidate upstream state, but the validated baseline could not be delivered as a Pull Request.\n\n' +
                    'Validation:\n' +
                    '- static PASS\n- real still PASS\n- real MP4 PASS\n\n' +
                    'Delivery failure occurred while creating/pushing/opening the PR.\n\n' +
                    'The recorded main baseline has NOT been updated.\n' +
                    'Review the workflow permissions / branch / PR creation error in the workflow run.'
            });

      # ---- high-risk drift: maintainer review required ----

      - name: Open high-risk review issue
        if: steps.drift.outputs.level == 'high'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const d = JSON.parse(fs.readFileSync('./drift.json', 'utf8'));
            const title = d.issueTitle;
            const existing = await github.rest.issues.listForRepo({...context.repo, state: 'open'});
            if (existing.data.some(i => i.title === title)) return;
            const lines = d.reasons.map(r => '- ' + r).join('\n');
            await github.rest.issues.create({
              ...context.repo,
              title,
              body: 'MAINTAINER REVIEW REQUIRED — upstream drift classified high-risk.\n\n' + lines +
                    '\n\nRecorded baseline: Remotion ' + d.recorded.remotion + ' / skills ' + d.recorded.skills +
                    '\nUpstream now: Remotion ' + d.upstream.remotion + ' / skills ' + d.upstream.skills +
                    '\n\nChecklist:\n' +
                    '- Review the upstream changes (https://github.com/remotion-dev/skills, https://github.com/remotion-dev/remotion/releases)\n' +
                    '- For each NEW UPSTREAM SKILL: add routing coverage in `skills/remotion/SKILL.md`\n' +
                    '- For each removed/renamed skill: update the routing table + docs\n' +
                    '- Then update `compatibility/remotion.json` from a real verification run (see docs/verification-report.md)'
            });

      - name: Report unknown upstream state
        if: steps.drift.outputs.level == 'unknown'
        run: |
          echo "::warning::Upstream compatibility NOT checked successfully — npm/GitHub was unreadable (hiccup or rate limit). No compatibility claim was made; no issue was opened (transient failures must not create issue spam). Re-run the workflow or check manually with: node scripts/drift-check.mjs"
          {
            echo "## ⚠️ Upstream compatibility check did not run"
            echo
            echo "The upstream state (npm registry / remotion-dev/skills) could not be observed, so"
            echo "**compatibility was NOT verified** in this scheduled run. Recorded baseline: \`compatibility/remotion.json\`."
            echo
            echo "This is a monitoring failure, not a detected incompatibility. Re-run the workflow or check manually:"
            echo "\`node scripts/drift-check.mjs\`"
          } >> "$GITHUB_STEP_SUMMARY"
