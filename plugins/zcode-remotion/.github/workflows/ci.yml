name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Static/plugin validation across every claimed platform and Node line.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
        include:
          # extra Node lines on one OS to keep the matrix lean — the public
          # support claim (Node >= 18) is covered by the 18 column above.
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - run: node --test scripts/verify-plugin.test.mjs
      - run: node scripts/verify-plugin.mjs --offline

  # Online link check once (network flakiness does not need 8 replicas).
  online-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/verify-plugin.mjs

  # PR merge gate: run the real compatibility smoke when behavior-relevant
  # files change, so Remotion compatibility failures surface BEFORE merge,
  # not on main. Docs/README-only changes skip the heavy Chrome render.
  # On push events this job always reports code=true (main must always render);
  # it exists as a job so the gate can depend on a single `needs` edge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "push event — compat-smoke will run"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(skills/|commands/|scripts/|compatibility/|\.zcode-plugin/|marketplace\.json|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "behavior-relevant changes detected — compat-smoke will run"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only change — compat-smoke skipped"
          fi

  # Real Remotion validation at the recorded compatibility baseline:
  # clean-state official-skills bootstrap, official Mediabunny pairing check,
  # consistency check + still and MP4 renders. Heavy (downloads Chrome
  # Headless Shell): always on main, and on PRs that touch behavior-relevant
  # files (merge gate).
  compat-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/compat-smoke.mjs --mp4

  # Single stable check for branch protection. A conditional job (compat-smoke)
  # must not be a required status check directly — it is legitimately "skipped"
  # on docs-only PRs. This aggregator succeeds exactly when every real check
  # succeeded and the heavy smoke either passed or was intentionally skipped.
  required-ci:
    needs: [verify, online-verify, changes, compat-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "verify:        ${{ needs.verify.result }}"
          echo "online-verify: ${{ needs.online-verify.result }}"
          echo "changes:       ${{ needs.changes.result }}"
          echo "compat-smoke:  ${{ needs.compat-smoke.result }}"
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.online-verify.result }}" = "success"
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.compat-smoke.result }}" = "success" || test "${{ needs.compat-smoke.result }}" = "skipped"
          echo "required-ci: PASS"
