<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Instrument">
  <defs>
    <linearGradient id="badge" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e313b"/>
      <stop offset="1" stop-color="#181920"/>
    </linearGradient>
    <linearGradient id="arc" x1="12" y1="50" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8933a"/>
      <stop offset="0.5" stop-color="#f0b357"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="64" height="64" rx="15" fill="url(#badge)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- gauge track (270deg, opening at the bottom) -->
  <circle cx="32" cy="33" r="19" fill="none" stroke="#31343d" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="89.5 29.9" transform="rotate(135 32 33)"/>

  <!-- value arc (~66%) -->
  <circle cx="32" cy="33" r="19" fill="none" stroke="url(#arc)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="59 59.4" transform="rotate(135 32 33)"/>

  <!-- needle -->
  <path d="M32 33 L41.5 23.5" fill="none" stroke="#ecedf1" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="32" cy="33" r="4.6" fill="#ecedf1"/>
  <circle cx="32" cy="33" r="1.9" fill="#17181c"/>

</svg>
