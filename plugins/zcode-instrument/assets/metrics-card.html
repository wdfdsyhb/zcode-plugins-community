<!--
  仪表盘卡片模板（可选）。

  把 {{...}} 占位符替换成 metrics 工具返回的真实数值后，作为内联 HTML 片段渲染，
  就能在对话里得到一张紧凑的指标卡片。渲染前请先读 visualize 技能了解宿主允许的写法；
  占位符与取值来源：

    {{MODEL}}   模型 id（如 deepseek/deepseek-v4.1-flash）
    {{PROVIDER}} provider id
    {{TTFT}}    首字延迟（如 8.3s）
    {{TPS}}     生成速度（如 119.5）
    {{OUTPUT}}  输出 tokens（如 580，可带千分位）
    {{INPUT}}   输入 tokens
    {{CACHE}}   缓存命中 tokens（含命中率，如 129,536 · 98.0%）
    {{TOTAL}}   合计 tokens
    {{TIME}}    请求完成时间
-->
<div class="rm-card">
  <div class="rm-head">
    <span class="rm-dot" aria-hidden="true"></span>
    <span class="rm-model">{{MODEL}}</span>
    <span class="rm-provider">{{PROVIDER}}</span>
    <span class="rm-time">{{TIME}}</span>
  </div>

  <div class="rm-metrics">
    <div class="rm-metric">
      <span class="rm-label">首字延迟</span>
      <span class="rm-value">{{TTFT}}</span>
    </div>
    <div class="rm-metric">
      <span class="rm-label">生成速度</span>
      <span class="rm-value">{{TPS}}<span class="rm-unit">tok/s</span></span>
    </div>
    <div class="rm-metric">
      <span class="rm-label">输出</span>
      <span class="rm-value">{{OUTPUT}}<span class="rm-unit">tok</span></span>
    </div>
  </div>

  <div class="rm-foot">
    <span>输入 {{INPUT}}</span>
    <span>缓存命中 {{CACHE}}</span>
    <span>合计 {{TOTAL}} tok</span>
  </div>
</div>

<style>
  .rm-card {
    color-scheme: light dark;
    --rm-bg: light-dark(#f7f8fa, #1c1d21);
    --rm-fg: light-dark(#1c1d21, #eceef2);
    --rm-muted: light-dark(#6b7280, #9aa0aa);
    --rm-line: light-dark(#e3e5ea, #2c2e34);
    --rm-accent: light-dark(#2f6df6, #7aa2ff);
    font: 400 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--rm-bg);
    color: var(--rm-fg);
    border: 1px solid var(--rm-line);
    border-radius: 12px;
    padding: 12px 14px;
    max-width: 460px;
    margin: 8px 0;
  }
  .rm-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rm-line);
  }
  .rm-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rm-accent); }
  .rm-model { font-weight: 600; }
  .rm-provider { color: var(--rm-muted); font-size: 12px; }
  .rm-time { margin-left: auto; color: var(--rm-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .rm-metrics { display: flex; gap: 10px; padding: 12px 0 10px; }
  .rm-metric { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .rm-label { color: var(--rm-muted); font-size: 11px; }
  .rm-value {
    font: 600 18px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .rm-unit { margin-left: 3px; font-size: 11px; font-weight: 400; color: var(--rm-muted); }
  .rm-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    padding-top: 10px;
    border-top: 1px solid var(--rm-line);
    color: var(--rm-muted);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
</style>
